# Publishes to npm when a version tag is pushed:
#   git tag v0.1.0 && git push --tags
# Needs an NPM_TOKEN repository secret (an npm automation token).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: bun run release:check
      # release:check already ran above; skip the prepublishOnly re-run
      - run: bun publish --access public --ignore-scripts
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
