# Publishes htmx-ui, htmx-ui-engine, the official plugins (htmx-ui-plugin-docs,
# -versions, -search), create-htmx-ui and htmx-ui-upgrade to npm when a version tag is pushed:
#   git tag v0.1.0 && git push --tags
# The packages share one version (release:check enforces it).
# Needs an NPM_TOKEN repository secret (an npm automation token).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The Node runtime (Vite) smoke tests in release:check need Node 22.12+
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Tag matches the packages' version
        run: |
          version=$(bun -e 'console.log((await Bun.file("packages/ui/package.json").json()).version)')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package version $version"; exit 1; }
      - run: bun run release:check
      # Dependency order: the engine and the scaffolder point at htmx-ui, the plugins at both
      - run: bun publish --access public --ignore-scripts
        working-directory: packages/ui
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --access public --ignore-scripts
        working-directory: packages/engine
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --access public --ignore-scripts
        working-directory: packages/plugin-docs
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --access public --ignore-scripts
        working-directory: packages/plugin-versions
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --access public --ignore-scripts
        working-directory: packages/plugin-search
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --access public --ignore-scripts
        working-directory: packages/create-htmx-ui
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --access public --ignore-scripts
        working-directory: packages/upgrade
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
