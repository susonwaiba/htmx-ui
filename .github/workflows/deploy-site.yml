name: deploy-site-to-github-pages

on:
  push:
    branches:
      - site # Triggers the workflow every time you push to the site branch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: bun install --frozen-lockfile

      # The published path, e.g. https://<owner>.github.io/<repo> for a project
      # site. The build bakes absolute URLs from $SITE_URL (sitemaps,
      # robots.txt, llms.txt), so the whole deploy needs it. Compose it from the
      # action's output instead of hardcoding, so a rename of the repository
      # cannot silently break every URL.
      - name: Resolve the public site URL
        id: site
        run: echo "url=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_OUTPUT"

      # The same command as locally: build with $SITE_URL, rewrite dist/ for the
      # subdirectory, then verify it. The check is the last step, so a dist with
      # a relative URL, a dev-server origin, a dead link or a missing clean-URL
      # route fails the job before anything is uploaded.
      #
      # GA_MEASUREMENT_ID (the GA4 stream, e.g. G-XXXXXXX) is an Actions
      # *variable* under Settings > Secrets and variables > Actions. Left unset,
      # the build emits no analytics at all — which is what local builds and CI
      # want, so nothing here hardcodes it.
      - name: Build, prepare and check
        run: bun run deploy
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
