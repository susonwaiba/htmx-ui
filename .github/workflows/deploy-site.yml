name: deploy-site-to-github-pages

on:
  push:
    branches:
      - main # Triggers the workflow every time you push to the main branch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run scripts/prepare-for-github-pages.ts

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # "." targets the root of your repository.
          # Change to "./dist" or "./public" if your static files are inside a subfolder.
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
