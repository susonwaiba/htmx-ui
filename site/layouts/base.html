<!doctype html>
<html lang="en" data-theme="aurora">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}HTMX UI{% endblock %}</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    {% block head %}{% endblock %}
    {% if ga %}
      <!-- Google Analytics, only when GA_MEASUREMENT_ID is set (the deploy pipeline).
           Locally and in CI it is unset, so no snippet, no request, nothing to block. -->
      <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga }}"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        gtag("js", new Date());
        gtag("config", "{{ ga }}");

        // Links here are hx-boosted: most navigation is an htmx swap with a pushed
        // history entry and no page load, so the snippet above would only ever see
        // the first page. Send a page_view whenever the URL actually changes —
        // settled, so the new document.title is already in place.
        let gaUrl = location.pathname + location.search;
        document.addEventListener("htmx:after:settle", () => {
          const url = location.pathname + location.search;
          if (url === gaUrl) return;
          gaUrl = url;
          gtag("event", "page_view", {
            page_location: location.href,
            page_path: location.pathname,
            page_title: document.title,
          });
        });
      </script>
    {% endif %}
    <script>
      // Apply the stored mode and colour palette before first paint to avoid a flash of the
      // wrong colors. Kept inline and tiny on purpose; htmx-ui/theme takes over once app.ts
      // loads — it reads the same two localStorage keys, so keep the two in sync.
      // The `js` class gates the scroll-in reveals (styles/app.css), so they only hide
      // content that JavaScript is about to reveal.
      (() => {
        document.documentElement.classList.add("js");
        const stored = localStorage.getItem("theme");
        const dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        const palette = localStorage.getItem("palette");
        if (palette) document.documentElement.dataset.theme = palette;
      })();
    </script>
    <script type="module" src="{{ asset('app.ts') }}"></script>
  </head>
  <body hx-boost:inherited="true" class="min-h-dvh bg-background text-foreground antialiased">
    {% block body %}{% endblock %}
  </body>
</html>
