<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><slot name="title">HTMX UI</slot></title>
    <slot name="head"></slot>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong
      // colors. Kept inline and tiny on purpose; src/features/theme.ts takes over
      // once app.ts loads.
      (() => {
        const stored = localStorage.getItem("theme");
        const dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <script type="module" src="../app.ts"></script>
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
    <include src="../partials/nav.html" />
    <main class="mx-auto max-w-2xl space-y-6 p-6">
      <slot></slot>
    </main>
    <include src="../partials/footer.html" />
  </body>
</html>
