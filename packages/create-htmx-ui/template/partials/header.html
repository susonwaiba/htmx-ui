{% from "components/icon/icon.html" import icon %}
{% set site = json("data/site.json") %}
<header class="border-b border-border">
  <div class="mx-auto flex max-w-3xl items-center gap-6 px-4 py-3">
    <a href="/" class="font-semibold">{{ site.name }}</a>
    <nav class="navigation-menu" aria-label="Main">
      <ul class="navigation-menu-list">
        {% for item in site.nav %}
        <li class="navigation-menu-item"><a href="{{ item.href }}" class="navigation-menu-link"{% if url == item.href %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button type="button" id="site-main-theme-switcher" class="btn btn-ghost btn-icon ml-auto" data-theme-toggle aria-pressed="false" title="Toggle light and dark theme" preserve="true">
      <span class="dark:hidden">{{ icon("sun") }}</span>
      <span class="hidden dark:inline">{{ icon("moon") }}</span>
      <span class="sr-only">Theme: <span data-theme-label>light</span></span>
    </button>
  </div>
</header>
