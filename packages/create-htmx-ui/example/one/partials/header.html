{% from "components/icon/icon.html" import icon %}
{% set site = json("data/site.json") %}
<header class="border-b border-border">
  <div class="mx-auto flex max-w-3xl items-center gap-6 px-4 py-3">
    <a href="/" class="font-semibold">{{ site.name }}</a>
    <nav class="flex gap-4 text-sm">
      {% for item in site.nav %}
      <a href="{{ item.href }}" class="{{ 'text-foreground' if url == item.href else 'text-muted-foreground hover:text-foreground' }}"{% if url == item.href %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <button type="button" id="site-main-theme-switcher" class="btn btn-ghost btn-icon ml-auto" data-theme-toggle aria-pressed="false" title="Toggle light and dark theme" hx-preserve="true">
      <span class="dark:hidden">{{ icon("sun") }}</span>
      <span class="hidden dark:inline">{{ icon("moon") }}</span>
      <span class="sr-only">Theme: <span data-theme-label>light</span></span>
    </button>
  </div>
</header>
