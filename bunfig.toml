# The dev server's bundler plugins (htmx-ui, then Tailwind) are set up by
# htmx-ui-engine: `htmx-ui dev` generates a bunfig for them. See
# packages/engine/src/bun/dev.ts.

# Give the test runner a DOM (document, matchMedia, localStorage) so feature
# modules can be tested without a browser.
[test]
preload = ["./scripts/dom-setup.ts"]
